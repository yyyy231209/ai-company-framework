<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
  </defs>
  <rect width="640" height="160" rx="20" fill="url(#bg)"/>
  <!-- building blocks: three little company nodes -->
  <g transform="translate(36, 60)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#accent)" opacity="0.95"/>
    <rect x="6" y="6" width="8" height="8" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="20" y="6" width="8" height="8" rx="2" fill="#fff" opacity="0.6"/>
    <rect x="6" y="20" width="8" height="8" rx="2" fill="#fff" opacity="0.6"/>
    <rect x="20" y="20" width="8" height="8" rx="2" fill="#fff" opacity="0.9"/>
  </g>
  <g transform="translate(84, 44)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#e94560" opacity="0.9"/>
    <circle cx="17" cy="17" r="8" fill="#fff" opacity="0.85"/>
  </g>
  <g transform="translate(132, 70)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#accent)" opacity="0.8"/>
    <path d="M6 26 L13 12 L20 26 Z" fill="#fff" opacity="0.85"/>
  </g>
  <!-- connector lines -->
  <line x1="70" y1="70" x2="84" y2="61" stroke="#e94560" stroke-width="2.5" opacity="0.7"/>
  <line x1="118" y1="61" x2="132" y2="78" stroke="#e94560" stroke-width="2.5" opacity="0.7"/>
  <!-- title -->
  <text x="190" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">AI Company</text>
  <text x="190" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#e94560">Framework</text>
  <!-- tagline -->
  <text x="190" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9aa7c0">Say It. A Company Is Born.</text>
</svg>
